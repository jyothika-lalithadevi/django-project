<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 70px;
    min-height: 100vh;
    background: linear-gradient(to bottom, #87ceeb, #e0f6ff);
}

h1 {
    color: #075985;
    margin-bottom: 30px;
}


form {
    width: 420px;
    margin: auto;
    padding: 30px;
    background-color: rgba(255, 255, 255, 0.9);
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
}

input {
    width: 230px;
    padding: 11px;
    border: 1px solid #aaa;
    border-radius: 6px;
    font-size: 15px;
}

button {
    padding: 11px 18px;
    margin-left: 6px;
    border: none;
    border-radius: 6px;
    background-color: #2196f3;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background-color: #1976d2;
}

.error {
    margin-top: 18px;
    color: #d32f2f;
    font-size: 15px;
}

h2 {
    margin-top: 25px;
}

p {
    margin-top: 10px;
}
    
</style>
<body>
    <h1>Weather App</h1>
    <form method="get">
       
        <label for="city"></label>
        <input type="text" name="city" placeholder="Enter City"/>
        <button type="submit">Get weather</button>
    </form>
    {% if city %}
        <h2>Weather in {{city}}</h2>
        <p>temerature:{{temperature}}°C</p>
        <p>condition:{{description}}</p>
        <p>Humidity:{{humidity}}</p>
    {% endif %}
    {% if error %}
     <p>{{error}}</p>
    {% endif %}
</body>
</html>
